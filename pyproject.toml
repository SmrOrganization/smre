[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smre"
version = "0.1.0"
description = "SMRE (The Slimewire Engine) - a Python game/app framework powered by SDL2 and OpenGL, with the SMRGUI immediate-mode UI library."
requires-python = ">=3.9"
dependencies = [
    "PySDL2>=0.9.16",
    "PyOpenGL>=3.1.7",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["smre*"]
